<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
    	<h1>Tablero de Puntos</h1>
        <div class="card">
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-5 rounded-3 p-2" id="panel-local">
                        <span class="display-1" id="puntaje-local">0</span>
                        <p class="m-0" id="nombre-local">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5 rounded-3 p-2" id="panel-visitante">
                        <span class="display-1" id="puntaje-visitante">0</span>
                        <p class="m-0" id="nombre-visitante">Visitante</p>
                    </div>
                </div>

                <hr class="hr">

                <h2>Actualizar puntaje</h2>
                <div class="row g-2">
                    <div class="col-6 col-md-3">
                        <button class="btn d-block w-100 btn-outline-primary control-puntaje"
                                type="button" data-equipo="local" data-cambio="-1"
                                aria-label="Restar un punto al equipo local">
                            − Local
                        </button>
                    </div>
                    <div class="col-6 col-md-3">
                        <button class="btn d-block w-100 btn-primary control-puntaje"
                                type="button" data-equipo="local" data-cambio="1"
                                aria-label="Sumar un punto al equipo local">
                            + Local
                        </button>
                    </div>
                    <div class="col-6 col-md-3">
                        <button class="btn d-block w-100 btn-outline-danger control-puntaje"
                                type="button" data-equipo="visitante" data-cambio="-1"
                                aria-label="Restar un punto al equipo visitante">
                            − Visitante
                        </button>
                    </div>
                    <div class="col-6 col-md-3">
                        <button class="btn d-block w-100 btn-danger control-puntaje"
                                type="button" data-equipo="visitante" data-cambio="1"
                                aria-label="Sumar un punto al equipo visitante">
                            + Visitante
                        </button>
                    </div>
                </div>

                <div class="row g-2 mt-2">
                    <div class="col-12 col-md-4">
                        <button class="btn d-block w-100 btn-secondary control-puntaje"
                                type="button" id="btn-invertir">
                            Invertir puntaje
                        </button>
                    </div>
                    <div class="col-12 col-md-4">
                        <button class="btn d-block w-100 btn-warning" type="button" id="btn-finalizar">
                            Finalizar partido
                        </button>
                    </div>
                    <div class="col-12 col-md-4">
                        <button class="btn d-block w-100 btn-danger" type="button" id="btn-reiniciar">
                            Reiniciar tablero
                        </button>
                    </div>
                </div>

                <p id="estado-partido" class="mt-3 mb-0" role="status" aria-live="polite">
                    Partido en juego.
                </p>

                <hr class="hr">

                <h2>Personalizar tablero</h2>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="input-nombre-local" class="form-label">Nombre del equipo local</label>
                        <input type="text" class="form-control" id="input-nombre-local" value="Local">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="input-nombre-visitante" class="form-label">Nombre del equipo visitante</label>
                        <input type="text" class="form-control" id="input-nombre-visitante" value="Visitante">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="color-local" class="form-label">Color del equipo local</label>
                        <input type="color" class="form-control form-control-color d-block" id="color-local"
                               value="#0d6efd" title="Elegir color del equipo local">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="color-visitante" class="form-label">Color del equipo visitante</label>
                        <input type="color" class="form-control form-control-color d-block" id="color-visitante"
                               value="#dc3545" title="Elegir color del equipo visitante">
                    </div>
                </div>

                <p class="small text-muted mt-3 mb-0">
                    Atajos: A/Z suman o restan al local; K/M suman o restan al visitante;
                    I invierte el puntaje y R reinicia el tablero. Los atajos no se ejecutan mientras escribís.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script>
        let puntajeLocal = 0;
        let puntajeVisitante = 0;
        let partidoFinalizado = false;

        const elementoPuntajeLocal = document.getElementById('puntaje-local');
        const elementoPuntajeVisitante = document.getElementById('puntaje-visitante');
        const estadoPartido = document.getElementById('estado-partido');
        const botonesPuntaje = document.querySelectorAll('.control-puntaje');

        function mostrarPuntajes() {
            elementoPuntajeLocal.textContent = puntajeLocal;
            elementoPuntajeVisitante.textContent = puntajeVisitante;
        }

        function actualizarPuntaje(equipo, cambio) {
            if (partidoFinalizado) return;

            if (equipo === 'local') {
                puntajeLocal = Math.max(0, puntajeLocal + cambio);
            } else {
                puntajeVisitante = Math.max(0, puntajeVisitante + cambio);
            }
            mostrarPuntajes();
        }

        document.querySelectorAll('[data-equipo][data-cambio]').forEach(boton => {
            boton.addEventListener('click', () => {
                actualizarPuntaje(boton.dataset.equipo, Number(boton.dataset.cambio));
            });
        });

        document.getElementById('btn-invertir').addEventListener('click', () => {
            [puntajeLocal, puntajeVisitante] = [puntajeVisitante, puntajeLocal];
            mostrarPuntajes();
        });

        document.getElementById('btn-finalizar').addEventListener('click', () => {
            partidoFinalizado = true;
            botonesPuntaje.forEach(boton => {
                boton.disabled = true;
            });
            document.getElementById('btn-finalizar').disabled = true;
            estadoPartido.textContent = 'Partido finalizado. Reiniciá el tablero para volver a jugar.';
        });

        document.getElementById('btn-reiniciar').addEventListener('click', () => {
            puntajeLocal = 0;
            puntajeVisitante = 0;
            partidoFinalizado = false;
            botonesPuntaje.forEach(boton => {
                boton.disabled = false;
            });
            document.getElementById('btn-finalizar').disabled = false;
            estadoPartido.textContent = 'Partido en juego.';
            mostrarPuntajes();
        });

        document.getElementById('input-nombre-local').addEventListener('input', e => {
            document.getElementById('nombre-local').textContent = e.target.value.trim() || 'Local';
        });
        document.getElementById('input-nombre-visitante').addEventListener('input', e => {
            document.getElementById('nombre-visitante').textContent = e.target.value.trim() || 'Visitante';
        });

        function aplicarColorEquipo(entrada, panel) {
            const color = entrada.value;
            const rgb = color.slice(1).match(/.{2}/g).map(componente => parseInt(componente, 16) / 255);
            const luminancia = rgb
                .map(componente => componente <= 0.03928
                    ? componente / 12.92
                    : ((componente + 0.055) / 1.055) ** 2.4)
                .reduce((total, componente, indice) => total + componente * [0.2126, 0.7152, 0.0722][indice], 0);

            panel.style.backgroundColor = color;
            panel.style.color = luminancia > 0.179 ? '#000000' : '#ffffff';
        }

        const colorLocal = document.getElementById('color-local');
        const colorVisitante = document.getElementById('color-visitante');
        colorLocal.addEventListener('input', () => {
            aplicarColorEquipo(colorLocal, document.getElementById('panel-local'));
        });
        colorVisitante.addEventListener('input', () => {
            aplicarColorEquipo(colorVisitante, document.getElementById('panel-visitante'));
        });
        aplicarColorEquipo(colorLocal, document.getElementById('panel-local'));
        aplicarColorEquipo(colorVisitante, document.getElementById('panel-visitante'));

        document.addEventListener('keydown', e => {
            if (e.altKey || e.ctrlKey || e.metaKey
                || e.target.closest('input, textarea, select, [contenteditable="true"]')) {
                return;
            }

            const atajos = {
                a: () => actualizarPuntaje('local', 1),
                z: () => actualizarPuntaje('local', -1),
                k: () => actualizarPuntaje('visitante', 1),
                m: () => actualizarPuntaje('visitante', -1),
                i: () => {
                    if (!partidoFinalizado) {
                        [puntajeLocal, puntajeVisitante] = [puntajeVisitante, puntajeLocal];
                        mostrarPuntajes();
                    }
                },
                r: () => document.getElementById('btn-reiniciar').click()
            };
            const accion = atajos[e.key.toLowerCase()];
            if (accion) {
                e.preventDefault();
                accion();
            }
        });
    </script>
</body>
</html>
