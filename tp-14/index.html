<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Contactos</h1>
        <div class="card">
            <div class="card-body">
                <h2>Contactos</h2>

                <div class="row g-2 align-items-end mb-3">
                    <div class="col-12 col-md-5">
                        <label for="buscar-contactos" class="form-label">Buscar</label>
                        <input type="search" class="form-control" id="buscar-contactos"
                               placeholder="Nombre, apellido o teléfono">
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="orden-contactos" class="form-label">Ordenar por</label>
                        <select id="orden-contactos" class="form-select">
                            <option value="nombre">Nombre</option>
                            <option value="apellido">Apellido</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4 d-flex flex-wrap gap-3 align-items-center">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="solo-favoritos">
                            <label for="solo-favoritos" class="form-check-label">Sólo favoritos</label>
                        </div>
                        <button type="button" class="btn btn-outline-danger" id="eliminar-seleccionados" disabled>
                            Eliminar seleccionados
                        </button>
                    </div>
                </div>

                <ul id="lista-contactos" class="list-group"></ul>
                <p id="mensaje" class="mt-3 mb-0" role="status" aria-live="polite"></p>

                <hr class="hr">

                <h2 id="titulo-formulario">Nuevo Contacto</h2>
                <form id="form-contacto">
                    <div class="row g-2 mb-3">
                        <div class="col-12 col-md-4">
                            <label for="input-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="nombre" id="input-nombre"
                                   placeholder="Nombre" autocomplete="given-name" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="input-apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" name="apellido" id="input-apellido"
                                   placeholder="Apellido" autocomplete="family-name" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="input-telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" name="telefono" id="input-telefono"
                                   placeholder="Teléfono" autocomplete="tel">
                        </div>
                    </div>
                    <button class="btn btn-primary" id="btn-guardar" type="submit">Agregar Contacto</button>
                    <button class="btn btn-secondary d-none" id="btn-cancelar-edicion" type="button">
                        Cancelar edición
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        let contactos = [
            {
                id: 1,
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '',
                favorito: false
            },
        ];
        let siguienteIdContacto = 2;
        let contactoEnEdicion = null;
        const contactosSeleccionados = new Set();
        const listaContactos = document.getElementById('lista-contactos');
        const formulario = document.getElementById('form-contacto');
        const botonEliminarSeleccionados = document.getElementById('eliminar-seleccionados');

        function normalizarTexto(valor) {
            return valor.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es');
        }

        /**
         * agregarContacto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nuevo contacto para agregar.
         */
        function agregarContacto(nombre, apellido, telefono) {
            contactos.push({
                id: siguienteIdContacto++,
                nombre: nombre.trim(),
                apellido: apellido.trim(),
                telefono: telefono.trim(),
                favorito: false
            });
            mostrarListado();
            mostrarMensaje('Contacto agregado.');
        }

        /**
         * mostrarListado()
         * esta función se encarga de mostrar en el DOM la lista de todos los contactos guardados en la variable global contactos.
         */
        function mostrarListado() {
            const busqueda = normalizarTexto(document.getElementById('buscar-contactos').value.trim());
            const soloFavoritos = document.getElementById('solo-favoritos').checked;
            const campoOrden = document.getElementById('orden-contactos').value;
            const contactosVisibles = contactos
                .filter(contacto => !soloFavoritos || contacto.favorito)
                .filter(contacto => {
                    const contenido = normalizarTexto(
                        `${contacto.nombre} ${contacto.apellido} ${contacto.telefono}`
                    );
                    return contenido.includes(busqueda);
                })
                .sort((a, b) => normalizarTexto(a[campoOrden]).localeCompare(
                    normalizarTexto(b[campoOrden]),
                    'es'
                ));

            listaContactos.replaceChildren();

            if (contactosVisibles.length === 0) {
                const itemVacio = document.createElement('li');
                itemVacio.className = 'list-group-item text-muted';
                itemVacio.textContent = contactos.length === 0
                    ? 'Todavía no hay contactos.'
                    : 'No hay contactos que coincidan con la búsqueda o los filtros.';
                listaContactos.append(itemVacio);
                actualizarBotonEliminarSeleccionados();
                return;
            }

            const fragmento = document.createDocumentFragment();
            contactosVisibles.forEach(contacto => {
                const nombreCompleto = `${contacto.nombre} ${contacto.apellido}`;
                const item = document.createElement('li');
                item.className = 'list-group-item d-flex justify-content-between align-items-center flex-wrap gap-3';

                const seleccion = document.createElement('div');
                seleccion.className = 'form-check mb-0';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'form-check-input';
                checkbox.checked = contactosSeleccionados.has(contacto.id);
                checkbox.dataset.contactoId = contacto.id;
                checkbox.setAttribute('aria-label', `Seleccionar a ${nombreCompleto}`);
                seleccion.append(checkbox);

                const datos = document.createElement('div');
                datos.className = 'flex-grow-1';
                const nombre = document.createElement('strong');
                nombre.textContent = nombreCompleto;
                const telefono = document.createElement('div');
                telefono.className = 'text-muted small';
                telefono.textContent = `Teléfono: ${contacto.telefono || 'No informado'}`;
                datos.append(nombre, telefono);

                const acciones = document.createElement('div');
                acciones.className = 'd-flex flex-wrap gap-2';
                acciones.append(
                    crearBotonAccion(
                        contacto.favorito ? 'Quitar favorito' : 'Marcar favorito',
                        contacto.favorito ? 'btn btn-warning btn-sm' : 'btn btn-outline-warning btn-sm',
                        'favorito',
                        contacto
                    ),
                    crearBotonAccion('Editar', 'btn btn-outline-primary btn-sm', 'editar', contacto),
                    crearBotonAccion('Eliminar', 'btn btn-outline-danger btn-sm', 'eliminar', contacto)
                );

                item.append(seleccion, datos, acciones);
                fragmento.append(item);
            });
            listaContactos.append(fragmento);
            actualizarBotonEliminarSeleccionados();
        }

        function crearBotonAccion(texto, clases, accion, contacto) {
            const boton = document.createElement('button');
            boton.type = 'button';
            boton.className = clases;
            boton.textContent = texto;
            boton.dataset.accion = accion;
            boton.dataset.contactoId = contacto.id;
            if (accion === 'favorito') {
                boton.setAttribute('aria-pressed', String(contacto.favorito));
            }
            return boton;
        }

        function mostrarMensaje(texto) {
            document.getElementById('mensaje').textContent = texto;
        }

        function actualizarBotonEliminarSeleccionados() {
            const cantidad = contactosSeleccionados.size;
            botonEliminarSeleccionados.disabled = cantidad === 0;
            botonEliminarSeleccionados.textContent = cantidad > 0
                ? `Eliminar seleccionados (${cantidad})`
                : 'Eliminar seleccionados';
        }

        function iniciarEdicion(contacto) {
            contactoEnEdicion = contacto.id;
            document.getElementById('input-nombre').value = contacto.nombre;
            document.getElementById('input-apellido').value = contacto.apellido;
            document.getElementById('input-telefono').value = contacto.telefono;
            document.getElementById('titulo-formulario').textContent = 'Editar Contacto';
            document.getElementById('btn-guardar').textContent = 'Guardar cambios';
            document.getElementById('btn-cancelar-edicion').classList.remove('d-none');
            document.getElementById('input-nombre').focus();
        }

        function cancelarEdicion() {
            contactoEnEdicion = null;
            formulario.reset();
            document.getElementById('titulo-formulario').textContent = 'Nuevo Contacto';
            document.getElementById('btn-guardar').textContent = 'Agregar Contacto';
            document.getElementById('btn-cancelar-edicion').classList.add('d-none');
        }

        function handlerFormulario(e) {
            e.preventDefault();
            const nombre = document.getElementById('input-nombre').value.trim();
            const apellido = document.getElementById('input-apellido').value.trim();
            const telefono = document.getElementById('input-telefono').value.trim();

            if (!nombre || !apellido) {
                mostrarMensaje('Ingresá un nombre y un apellido.');
                return;
            }

            if (contactoEnEdicion !== null) {
                const contacto = contactos.find(item => item.id === contactoEnEdicion);
                if (contacto) {
                    contacto.nombre = nombre;
                    contacto.apellido = apellido;
                    contacto.telefono = telefono;
                }
                cancelarEdicion();
                mostrarListado();
                mostrarMensaje('Contacto actualizado.');
                return;
            }

            agregarContacto(nombre, apellido, telefono);
            formulario.reset();
        }

        formulario.addEventListener('submit', handlerFormulario);

        listaContactos.addEventListener('change', e => {
            const checkbox = e.target.closest('input[type="checkbox"][data-contacto-id]');
            if (!checkbox) return;

            const id = Number(checkbox.dataset.contactoId);
            if (checkbox.checked) {
                contactosSeleccionados.add(id);
            } else {
                contactosSeleccionados.delete(id);
            }
            actualizarBotonEliminarSeleccionados();
        });

        listaContactos.addEventListener('click', e => {
            const boton = e.target.closest('button[data-accion]');
            if (!boton) return;

            const id = Number(boton.dataset.contactoId);
            const contacto = contactos.find(item => item.id === id);
            if (!contacto) return;

            switch (boton.dataset.accion) {
                case 'favorito':
                    contacto.favorito = !contacto.favorito;
                    mostrarListado();
                    break;
                case 'editar':
                    iniciarEdicion(contacto);
                    break;
                case 'eliminar':
                    contactos = contactos.filter(item => item.id !== id);
                    contactosSeleccionados.delete(id);
                    if (contactoEnEdicion === id) cancelarEdicion();
                    mostrarListado();
                    mostrarMensaje('Contacto eliminado.');
                    break;
            }
        });

        document.getElementById('buscar-contactos').addEventListener('input', mostrarListado);
        document.getElementById('orden-contactos').addEventListener('change', mostrarListado);
        document.getElementById('solo-favoritos').addEventListener('change', mostrarListado);

        botonEliminarSeleccionados.addEventListener('click', () => {
            const idsEliminados = new Set(contactosSeleccionados);
            contactos = contactos.filter(contacto => !idsEliminados.has(contacto.id));
            if (contactoEnEdicion !== null && idsEliminados.has(contactoEnEdicion)) {
                cancelarEdicion();
            }
            contactosSeleccionados.clear();
            mostrarListado();
            mostrarMensaje(`${idsEliminados.size} contacto(s) eliminado(s).`);
        });

        document.getElementById('btn-cancelar-edicion').addEventListener('click', cancelarEdicion);
        mostrarListado();
    </script>
</body>
</html>
