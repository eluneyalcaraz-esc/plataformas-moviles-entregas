<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card">
            <div class="card-body">
                <h2>Texto</h2>

                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row">
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-negrita" type="button" class="btn d-block w-100 btn-outline-primary"
                                data-formato="negrita" aria-pressed="false">
                            Negrita: desactivada
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cursiva" type="button" class="btn d-block w-100 btn-outline-primary"
                                data-formato="cursiva" aria-pressed="false">
                            Cursiva: desactivada
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-subrayado" type="button" class="btn d-block w-100 btn-outline-primary"
                                data-formato="subrayado" aria-pressed="false">
                            Subrayado: desactivado
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-color" type="button" class="btn d-block w-100 btn-outline-primary"
                                data-formato="color" aria-pressed="false">
                            Color rojo: desactivado
                        </button>
                    </div>
                </div>

                <div class="mt-4">
                    <label for="entrada-texto" class="form-label">Editar texto</label>
                    <input id="entrada-texto" type="text" class="form-control" autocomplete="off">
                </div>

                <div class="mt-3">
                    <label for="tamano-texto" class="form-label">
                        Tamaño del texto: <output id="valor-tamano" for="tamano-texto">16 px</output>
                    </label>
                    <input id="tamano-texto" type="range" class="form-range"
                           min="12" max="48" step="1" value="16">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        /**
         * funcionNegrita()
         * Esta función se ejecuta cuando el usuario selecciona la opción Bold (negrita).
         */
        function funcionNegrita() {
            alternarEstilo('negrita', 'fw-bold');
        }

        /**
         * funcionCursiva()
         * Esta función se ejecuta cuando el usuario selecciona la opción Italic (cursiva).
         */
        function funcionCursiva() {
            alternarEstilo('cursiva', 'fst-italic');
        }

        /**
         * funcionSubrayado()
         * Esta función se ejecuta cuando el usuario selecciona la opción Underline (subrayado).
         */
        function funcionSubrayado() {
            alternarEstilo('subrayado', 'text-decoration-underline');
        }

        function funcionColor() {
            alternarEstilo('color', 'text-danger');
        }

        const texto = document.getElementById('texto');
        const entradaTexto = document.getElementById('entrada-texto');
        const nombresEstilos = {
            negrita: 'Negrita',
            cursiva: 'Cursiva',
            subrayado: 'Subrayado',
            color: 'Color rojo'
        };

        function alternarEstilo(formato, clase) {
            const activado = texto.classList.toggle(clase);
            const boton = document.querySelector(`[data-formato="${formato}"]`);
            boton.setAttribute('aria-pressed', String(activado));
            boton.classList.toggle('btn-primary', activado);
            boton.classList.toggle('btn-outline-primary', !activado);
            boton.textContent = `${nombresEstilos[formato]}: ${activado ? 'activado' : 'desactivado'}`;
        }

        function handlerBoton(e) {
            // Obtiene el valor del atributo "data-formato" del botón que disparó el evento
            const funcionBoton = e.currentTarget.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }
        document.querySelectorAll('button.btn').forEach(e => e.addEventListener('click', handlerBoton));

        entradaTexto.value = texto.textContent.trim();
        entradaTexto.addEventListener('input', () => {
            texto.textContent = entradaTexto.value;
        });

        const controlTamano = document.getElementById('tamano-texto');
        const valorTamano = document.getElementById('valor-tamano');
        controlTamano.addEventListener('input', () => {
            texto.style.fontSize = `${controlTamano.value}px`;
            valorTamano.value = `${controlTamano.value} px`;
        });
    </script>
</body>
</html>
