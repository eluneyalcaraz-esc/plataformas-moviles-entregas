<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout N</title>
    <style>
        .container-sm {width: 100%;}
        .row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: 1fr;
            gap: 0;
        }
        .col {min-width: 0;}
        /* Móvil: secciones 1–4 a todo el ancho; 5 y 6 comparten la última fila. */
        .col:nth-child(-n+4) {grid-column: 1 / -1;}
        .col:nth-child(5) {grid-column: 1;}
        .col:nth-child(6) {grid-column: 2;}
        .content {padding: 2em 0.5em; text-align: center;}
        .s1 {background-color: #ca9f77;}
        .s2 {background-color: #cbc168;}
        .s3 {background-color: #a3c55b;}
        .s4 {background-color: #76d179;}
        .s5 {background-color: #85e3c1;}
        .s6 {background-color: #79bfe5;}

        @media (min-width: 600px) {
            /* Tablet: sección 1 a la izquierda; 2–4 en tercios; 5–6 en mitades. */
            .row {grid-template-columns: repeat(6, minmax(0, 1fr));}
            .col:nth-child(1) {grid-column: 1 / span 3; grid-row: 1;}
            .col:nth-child(2) {grid-column: 1 / span 2; grid-row: 2;}
            .col:nth-child(3) {grid-column: 3 / span 2; grid-row: 2;}
            .col:nth-child(4) {grid-column: 5 / span 2; grid-row: 2;}
            .col:nth-child(5) {grid-column: 1 / span 3; grid-row: 3;}
            .col:nth-child(6) {grid-column: 4 / span 3; grid-row: 3;}
        }

        @media (min-width: 1024px) {
            /* Escritorio: proporciones 10/16/10 en una grilla de 36 columnas. */
            .row {grid-template-columns: repeat(36, minmax(0, 1fr));}
            .col:nth-child(1) {grid-column: 1 / span 18; grid-row: 1;}
            .col:nth-child(2) {grid-column: 1 / span 10; grid-row: 2;}
            .col:nth-child(3) {grid-column: 11 / span 16; grid-row: 2;}
            .col:nth-child(4) {grid-column: 27 / span 10; grid-row: 2;}
            .col:nth-child(5) {grid-column: 1 / span 18; grid-row: 3;}
            .col:nth-child(6) {grid-column: 19 / span 18; grid-row: 3;}
        }
    </style>
</head>
<body>
    <div class="container-sm g-0">
        <div class="row g-0">
            <div class="col">
                <div class="content s1">sección 1</div>
            </div>
            <div class="col">
                <div class="content s2">sección 2</div>
            </div>
            <div class="col">
                <div class="content s3">sección 3</div>
            </div>
            <div class="col">
                <div class="content s4">sección 4</div>
            </div>
            <div class="col">
                <div class="content s5">sección 5</div>
            </div>
            <div class="col">
                <div class="content s6">sección 6</div>
            </div>
        </div>
    </div>
</body>
</html>
